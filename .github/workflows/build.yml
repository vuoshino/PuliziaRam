name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compila
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk PuliziaRAM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PuliziaRAM
          path: PuliziaRAM.apk

      - name: Pubblica nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pulizia RAM build ${{ github.run_number }}
          body: APK pronto da installare sul tablet.
          files: PuliziaRAM.apk
          make_latest: true
