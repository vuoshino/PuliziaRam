plugins {
    id 'com.android.application'
}

android {
    namespace 'it.tiziano.puliziaram'
    compileSdk 35

    defaultConfig {
        applicationId 'it.tiziano.puliziaram'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        fixed {
            storeFile file('keystore/puliziaram.jks')
            storePassword 'puliziaram'
            keyAlias 'puliziaram'
            keyPassword 'puliziaram'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
